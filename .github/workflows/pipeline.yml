name: dotnet-to-k3s

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release

      - name: Publish .NET project
        run: |
          dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj \
          -c Release \
          -o publish

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/gandru123/nop:v2 .

      - name: Push Docker image
        run: |
          docker push ghcr.io/gandru123/nop:v2

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.K3S_KUBECONFIG }}

      - name: Deploy to k3s
        run: |
          kubectl apply -f kubernetes/

          kubectl rollout restart deployment/nop-commerce-deployment

          kubectl rollout status deployment/nop-commerce-deployment