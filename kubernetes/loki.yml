deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h

  limits_config:
    retention_period: 24h
    allow_structured_metadata: false

singleBinary:
  replicas: 1

read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

chunksCache:
  enabled: false

resultsCache:
  enabled: false

gateway:
  enabled: true

  ingress:
    enabled: true
    ingressClassName: traefik

    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /

    hosts:
      - host: gateway.loki.13.200.4.238.nip.io
        paths:
          - path: /
            pathType: Prefix

    tls: []