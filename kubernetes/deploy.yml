apiVersion: apps/v1
kind: Deployment

metadata:
  name: nop-commerce-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nopcommerce

  template:
    metadata:
      labels:
        app: nopcommerce

    spec:
      imagePullSecrets:
      - name: ghcr-secret

      containers:
      - name: nopcommerce
        image: ghcr.io/gandru123/nop:v2
        imagePullPolicy: Always

        ports:
        - containerPort: 80